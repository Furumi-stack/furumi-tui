command = "MoveDown"

[[keymaps]]
key_sequence = "k"
command = "MoveUp"

[[keymaps]]
key_sequence = "up"
command = "MoveUp"

[[keymaps]]
key_sequence = "h"
command = "MoveLeft"

[[keymaps]]
key_sequence = "left"
command = "MoveLeft"

[[keymaps]]
key_sequence = "l"
command = "MoveRight"

[[keymaps]]
key_sequence = "right"
