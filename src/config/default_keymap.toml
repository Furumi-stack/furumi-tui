# Default keybindings for furumi.
#
# To customize, copy entries into keymap.toml in the platform config dir
# (~/.config/furumi/keymap.toml on Linux,
# ~/Library/Application Support/furumi/keymap.toml on macOS). A user binding
# replaces the default binding with the same key sequence and context.
#
# version: keymap format version; put `version = 2` at the top of your file,
# before the first [[keymaps]] entry (after one, TOML attaches it to that
# entry and the file is rejected). Version 2 numbers tabs in this order:
#   GoToTab = 0 Library, 1 Playlists, 2 Queue, 3 Podcasts, 4 Settings, 5 Logs.
# A file without `version` is treated as the older layout and its GoToTab
# indices are adapted in memory (3 -> 4 Settings, 4 -> 5 Logs, and 5 -> 3
# Podcasts from the prototype podcast build); the file itself is never
# rewritten. With `version = 2` indices are used exactly as written.
#
# key_sequence: space-separated chords, e.g. "g g" or "ctrl-a x".
#   Modifiers: ctrl-, alt-, shift-, cmd-. Uppercase letters: "shift-g".
# command: an Action name, optionally with parameters:
#   command = { SeekForward = { seconds = 30 } }
# context: optional view filter — global (default), library, search,
#   playlists, queue, podcasts, settings, logs.

version = 2

[[keymaps]]
key_sequence = "q"
command = "Quit"

[[keymaps]]
key_sequence = "ctrl-c"
command = "Quit"

[[keymaps]]
key_sequence = "?"
command = "ToggleHelp"

[[keymaps]]
key_sequence = "tab"
command = "NextTab"

[[keymaps]]
key_sequence = "backtab"
command = "PrevTab"

[[keymaps]]
key_sequence = "1"
command = { GoToTab = 0 }

[[keymaps]]
key_sequence = "2"
command = { GoToTab = 1 }

[[keymaps]]
key_sequence = "3"
command = { GoToTab = 2 }

[[keymaps]]
key_sequence = "4"
command = { GoToTab = 3 }

[[keymaps]]
key_sequence = "5"
command = { GoToTab = 4 }

[[keymaps]]
key_sequence = "6"
command = { GoToTab = 5 }

[[keymaps]]
key_sequence = "y"
command = "DownloadSelected"

[[keymaps]]
key_sequence = "a"
command = "QueueAddNext"

[[keymaps]]
key_sequence = "shift-a"
command = "QueueAddLast"

[[keymaps]]
