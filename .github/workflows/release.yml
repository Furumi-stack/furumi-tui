name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: furumi-linux-x86_64
            archive_ext: tar.gz
            binary_name: furumi
          - os: macos-latest
            asset_name: furumi-macos-aarch64
            archive_ext: tar.gz
            binary_name: furumi
          - os: windows-latest
            asset_name: furumi-windows-x86_64
            archive_ext: zip
            binary_name: furumi.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Build
        run: cargo build --release --locked --offline

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive_name="${{ matrix.asset_name }}-${version}.${{ matrix.archive_ext }}"
          package_dir="dist/${{ matrix.asset_name }}"
          mkdir -p "$package_dir"
          cp "target/release/${{ matrix.binary_name }}" "$package_dir/"
          cp README.md "$package_dir/"
          cp LICENSE "$package_dir/"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd dist && 7z a "../${archive_name}" "${{ matrix.asset_name }}")
          else
            tar -C dist -czf "${archive_name}" "${{ matrix.asset_name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}-*
          if-no-files-found: error

  publish:
    name: Publish release assets
    concurrency:
      group: release-assets-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          archives=(artifacts/*/*)
          assets=$(mktemp)
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$assets"; then
            for archive in "${archives[@]}"; do
              (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")")
            done > SHA256SUMS
            gh release create "$RELEASE_TAG" "${archives[@]}" SHA256SUMS \
              --title "furumi ${RELEASE_TAG}" \
              --notes "Release ${RELEASE_TAG}" \
              --verify-tag
            exit 0
          fi

          # Hash existing archives from the release itself. Rebuilt artifacts
          # can have different bytes even if the tag and file names match.
          published=$(mktemp -d)
          missing=()
          : > SHA256SUMS
          for archive in "${archives[@]}"; do
            name=$(basename "$archive")
            if grep -Fxq -- "$name" "$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$published"
              (cd "$published" && sha256sum "$name") >> SHA256SUMS
            else
              missing+=("$archive")
              (cd "$(dirname "$archive")" && sha256sum "$name") >> SHA256SUMS
            fi
          done

          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
          if grep -Fxq -- SHA256SUMS "$assets"; then
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$published"
            if ! cmp -s "$published/SHA256SUMS" SHA256SUMS; then
              gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
            fi
          else
            gh release upload "$RELEASE_TAG" SHA256SUMS
          fi

  update-homebrew:
    name: Dispatch Homebrew formula update
    needs: publish
    if: github.server_url == 'https://github.com' && github.repository == 'Furumi-stack/furumi-tui'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger workflow in the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping Homebrew for non-stable tag $RELEASE_TAG"
            exit 0
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN repository secret to dispatch the Homebrew update."
            exit 1
          fi
          gh workflow run update-furumi.yml \
            --repo house-of-vanity/homebrew-tap --ref main --raw-field "tag=$RELEASE_TAG"
